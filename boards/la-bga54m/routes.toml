[defaults]
layers = ["F.Cu", "B.Cu"]   # In1 = GND, In2 = 3.3 V planes: signals stay on the outer layers

# SDRAM bus: outermost arcs first (order = "angle", the default), the inner ones nest inside
[[route]]
net = "SD_*"

[[route]]
net = "USB_*"
order = "length"

# everything else, shortest first (planes connect through their pours)
[[route]]
net = "*"
order = "length"
