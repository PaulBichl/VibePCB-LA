[defaults]
layers = ["F.Cu", "B.Cu"]   # inner layers are planes (GND / 1.1 V / 3.3 V / GND)

# one bus per package side, each to the header on that side; outermost arcs first (order = "angle")
[[route]]
net = "IO_*"
parts = ["J1"]

[[route]]
net = "IO_*"
parts = ["J2"]

[[route]]
net = "IO_*"
parts = ["J3"]

[[route]]
net = "IO_*"
parts = ["J4"]

[[route]]
net = "JTAG_*"
order = "length"

# the rest (2.5 V aux), shortest first
[[route]]
net = "*"
order = "length"
