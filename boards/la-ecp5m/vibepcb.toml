# The ECP5's ball grid is escaped by VibePCB (vibepcb.fanout): rings 0/1 on top, deeper balls a dogbone and
# out on the bottom layer (inner2 / inner3 are the 1.1 V / 3.3 V planes, no tracks there). 0.1 mm tracks
# between 0.36 mm balls at 0.8 mm pitch; dogbone vias 0.4 / 0.2 mm, mechanically drilled.
[escape.U1]
track_width = 0.1
clearance = 0.1
via_diameter = 0.4
via_drill = 0.2
layers = ["bottom"]

# plane nets: their balls / pads get a via to the plane (inner1 / inner4 GND, inner2 1.1 V, inner3 3.3 V)
[planes]
nets = ["GND", "V1V1", "V3V3"]

# VibePCB routes (routes.toml); tscircuit only places
[routing]
mode = "manual"

# the placement-only build has no pours: GND outside and on inner1/inner4, the 1.1 V and 3.3 V planes
[pour.gnd]
net = "GND"
layers = ["F.Cu", "B.Cu", "In1.Cu", "In4.Cu"]

[pour.v1v1]
net = "V1V1"
layers = ["In2.Cu"]

[pour.v3v3]
net = "V3V3"
layers = ["In3.Cu"]
